<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 130" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fceda2" />
      <stop offset="40%" stop-color="#d4af37" />
      <stop offset="70%" stop-color="#aa820a" />
      <stop offset="100%" stop-color="#dfba42" />
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#d1d5db" />
      <stop offset="100%" stop-color="#9ca3af" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Emblem Left -->
  <g transform="translate(15, 10)">
    <!-- Outer Shield / Circle with gold trim -->
    <circle cx="55" cy="55" r="50" fill="#0d1117" stroke="url(#goldGrad)" stroke-width="2.5" />
    <circle cx="55" cy="55" r="44" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" stroke-dasharray="3 3" />
    
    <!-- Lady Justice Silhouette / Scales of Justice -->
    <!-- Scale Beam -->
    <path d="M 37 40 L 73 40 M 55 26 L 55 82" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>
    <polygon points="55,24 51,32 59,32" fill="url(#goldGrad)"/>
    <!-- Left Pan -->
    <path d="M 37 40 L 31 52 L 43 52 Z" fill="none" stroke="url(#goldGrad)" stroke-width="1.2"/>
    <path d="M 28 52 Q 37 60 46 52" fill="url(#goldGrad)" opacity="0.6"/>
    <!-- Right Pan -->
    <path d="M 73 40 L 67 52 L 79 52 Z" fill="none" stroke="url(#goldGrad)" stroke-width="1.2"/>
    <path d="M 64 52 Q 73 60 82 52" fill="url(#goldGrad)" opacity="0.6"/>
    <!-- Central Pedestal -->
    <path d="M 45 82 L 65 82 M 41 85 L 69 85" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Bold SW Monogram overlay -->
    <text x="55" y="70" font-family="'Cinzel', 'Playfair Display', 'Times New Roman', serif" font-size="28" font-weight="900" fill="url(#silverGrad)" text-anchor="middle" letter-spacing="1" opacity="0.95" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.8))">SW</text>
  </g>

  <!-- Typography Right -->
  <g transform="translate(135, 20)">
    <!-- Advocate dot decorator -->
    <circle cx="-12" cy="46" r="3.5" fill="url(#goldGrad)"/>
    
    <!-- Main Title -->
    <text x="0" y="48" font-family="'Cinzel', 'Trajan Pro', 'Cinzel Decorative', serif" font-size="34" font-weight="800" fill="#ffffff" letter-spacing="4">
      SW LEGAL HUB
    </text>

    <!-- Right dot decorator -->
    <circle cx="288" cy="46" r="3.5" fill="url(#goldGrad)"/>

    <!-- Subtle divider line -->
    <line x1="0" y1="58" x2="280" y2="58" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.8"/>

    <!-- Sub-tagline -->
    <text x="140" y="78" font-family="'Montserrat', 'Cinzel', sans-serif" font-size="12.5" font-weight="700" fill="url(#goldGrad)" letter-spacing="5" text-anchor="middle">
      ADVOCATE. ADVISE. ACHIEVE.
    </text>

    <!-- Sub-motto -->
    <text x="140" y="96" font-family="'Montserrat', sans-serif" font-size="8.5" font-weight="500" fill="#9ca3af" letter-spacing="2.5" text-anchor="middle">
      COMMITTED TO JUSTICE • DEDICATED TO YOUR RIGHTS
    </text>
  </g>
</svg>
